name: Refresh External Metadata

on:
  push:
    branches:
      - main
    paths:
      - content/home/home.md
      - tools/fetch-link-metadata.mjs
      - tools/validate-link-metadata.mjs
      - src/data/schemas/link-metadata.schema.json
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: refresh-metadata
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:metadata

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "No metadata updates."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/link-metadata.json public/assets/images/repos public/assets/images/portfolio
          git commit -m "chore(data): refresh external metadata"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy refreshed metadata
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
